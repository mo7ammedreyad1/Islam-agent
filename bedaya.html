<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS to GPT Nature - High End Motion</title>

    <!-- FONT IMPORTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #07090e; color: #ffffff;
            font-family: 'Plus Jakarta Sans', 'IBM Plex Sans Arabic', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; min-height: 100dvh; overflow: hidden; padding: 10px;
        }
        #viewport {
            position: relative;
            max-height: 86vh;
            max-width: 94vw;
            width: auto;
            height: auto;
            background: #000000;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.75), 0 0 1px 1px rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
        #hud {
            position: absolute; top: 16px; right: 16px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(14px);
            color: #0a0f1d; padding: 6px 14px; border-radius: 30px;
            font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); border: 1px solid rgba(0, 0, 0, 0.06); z-index: 10;
        }
        .spinner {
            width: 12px; height: 12px; border: 2px solid #e5e5ea;
            border-top: 2px solid #0a0f1d; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #controls-overlay {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 10; background: rgba(10, 15, 29, 0.92);
            padding: 6px 12px; border-radius: 40px; backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }
        .btn {
            font-family: inherit; font-size: 12px; font-weight: 700; padding: 6px 14px;
            border-radius: 20px; border: none; cursor: pointer; display: flex;
            align-items: center; gap: 6px; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-preview { background: rgba(255, 255, 255, 0.12); color: #f8fafc; }
        .btn-preview:hover { background: rgba(255, 255, 255, 0.22); }
        .btn-render { background: #0a0f1d; color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-render:hover { background: #1e293b; }
        #console-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 680px; max-width: 92vw; height: 400px; background: #090d16;
            border: 1px solid #1e293b; border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,0.8);
            z-index: 100; display: none; flex-direction: column; overflow: hidden;
        }
        #console-header {
            background: #151d2d; padding: 12px 18px; display: flex;
            justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold;
        }
        #console-output {
            flex: 1; padding: 14px; overflow-y: auto; font-family: monospace;
            font-size: 12px; color: #cbd5e1; background: #060910; line-height: 1.6;
        }
        .log-line { margin-bottom: 4px; }
        .log-info { color: #38bdf8; }
        .log-warn { color: #facc15; }
        .log-error { color: #f87171; }
    </style>
</head>
<body>
    <div id="viewport">
        <canvas id="videoCanvas"></canvas>
        <div id="hud"><div class="spinner" id="spinner"></div><span id="status-text">جاري إعداد المشهد...</span></div>
        <div id="controls-overlay">
            <button class="btn btn-preview" id="btn-replay"><i class="ph ph-arrow-counter-clockwise"></i> تشغيل المعاينة</button>
            <button class="btn btn-preview" id="btn-toggle-console"><i class="ph ph-terminal-window"></i> سجل الأخطاء</button>
            <button class="btn btn-render" id="btn-render-start"><i class="ph-fill ph-video-camera"></i> تصدير الفيديو</button>
        </div>
    </div>

    <div id="console-modal">
        <div id="console-header">
            <span><i class="ph ph-terminal-window"></i> سجل النظام والعمليات البرمجية</span>
            <button class="btn btn-preview" id="btn-close-console" style="color:#fff; background:#ef4444; border:none; padding:4px 14px;">إغلاق</button>
        </div>
        <div id="console-output"></div>
    </div>

    <script type="module">
        // =========================================================================
        // 1. IDENTITY LAYER: CONFIG & TECHNICAL CONTRACT
        // =========================================================================
        export const CONFIG = {
            fps: 30,
            width: 1920,
            height: 1080,
            duration: 12.0
        };

        export const OUTPUT_FILENAME = 'saas_to_gpt_nature_video';
        export let audioBuffer = null;

        // Easing Functions
        function easeOutBack(t, s = 1.35) { return (t = t - 1) * t * ((s + 1) * t + s) + 1; }
        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        // Asset containers
        const assets = { icons: {} };
        let natureBrollSampler = null;

        function loadSvgFromString(svgString) {
            const blob = new Blob([svgString], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.src = url;
            const promise = new Promise((res) => { img.onload = () => res(img); });
            return { img, promise };
        }

        export async function prepareIdentity() {
            logToConsole("بدء جلب الأصول من Pixabay و Iconify...", "info");

            // 1. Google Docs (Iconify logos:google-docs)
            assets.icons.docs = loadSvgFromString(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                    <path fill="#4285f4" d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6z"/>
                    <path fill="#a1c2fa" d="M14 2v6h6z"/>
                    <path fill="#ffffff" d="M8 12h8v1.5H8zm0 3h8v1.5H8zm0 3h5v1.5H8z"/>
                </svg>
            `);

            // 2. PDF Document (Iconify vscode-icons:file-type-pdf2)
            assets.icons.pdf = loadSvgFromString(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                    <path fill="#ea4335" d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6z"/>
                    <path fill="#f6aea4" d="M14 2v6h6z"/>
                    <rect x="6.5" y="11.5" width="11" height="6.5" rx="1" fill="#ffffff"/>
                    <path fill="#ea4335" d="M8 13h2.2c.6 0 1 .4 1 1s-.4 1-1 1H8v2h-1.2v-5H8zm1 1.2h-1v1.6h1c.4 0 .6-.2.6-.8s-.2-.8-.6-.8zm3.5 3.8h-1.2v-5h2c.8 0 1.4.6 1.4 1.4v2.2c0 .8-.6 1.4-1.4 1.4h-.8zm0-4v3h.6c.3 0 .5-.2.5-.5v-2c0-.3-.2-.5-.5-.5h-.6zm4.5 4h-1.2v-5H18v1h-1.8v1.2H18v1h-1.8v1.8z"/>
                </svg>
            `);

            // 3. Google Sheets (Iconify logos:google-sheets)
            assets.icons.sheets = loadSvgFromString(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                    <path fill="#0f9d58" d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6z"/>
                    <path fill="#87ceac" d="M14 2v6h6z"/>
                    <rect x="7.5" y="11.5" width="9" height="7.5" rx="0.8" fill="#ffffff"/>
                    <path fill="#0f9d58" d="M8.5 12.8h7v1.2h-7zm0 2.2h7v1.2h-7zm0 2.2h7v1.2h-7zm3-4.4v5.4h-1v-5.4z"/>
                </svg>
            `);

            // 4. Folder (Iconify lucide:folder)
            assets.icons.folder = loadSvgFromString(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#717d8e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
                </svg>
            `);

            // 5. Laptop (Iconify lucide:laptop)
            assets.icons.laptop = loadSvgFromString(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#717d8e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/>
                </svg>
            `);

            // 6. Microphone (Iconify lucide:mic)
            assets.icons.mic = loadSvgFromString(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#8d97a5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" x2="12" y1="19" y2="22"/>
                </svg>
            `);

            // 7. جلب لوجو GPT / OpenAI مباشرة من Iconify API
            try {
                const gptUrl = 'https://api.iconify.design/simple-icons:openai.svg?color=%23ffffff';
                const gptRes = await fetch(gptUrl);
                if (gptRes.ok) {
                    const gptSvg = await gptRes.text();
                    assets.icons.chatgpt = loadSvgFromString(gptSvg);
                    logToConsole("تم جلب لوجو GPT من Iconify بنجاح ✓", "info");
                }
            } catch (err) {
                logToConsole("تنبيه: تم استخدام مسار Iconify الاحتياطي للوجو: " + err.message, "warn");
            }

            if (!assets.icons.chatgpt) {
                assets.icons.chatgpt = loadSvgFromString(`
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="200" height="200">
                        <path fill="#ffffff" d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 8.937a4.485 4.485 0 0 1 2.366-1.973V12.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 8.937zm16.597 3.855l-5.833-3.387L15.119 8.24a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667zm2.01-3.023l-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 10.27V7.934a.08.08 0 0 1 .033-.061l4.839-2.792a4.5 4.5 0 0 1 6.68 5.233zM8.307 10.838l-2.02-1.163a.08.08 0 0 1-.038-.052V4.04a4.5 4.5 0 0 1 7.364-3.45l-.14.08-4.78 2.759a.795.795 0 0 0-.392.681v6.73zM9.614 13.5l2.383-1.378 2.378 1.378v2.75l-2.378 1.378-2.383-1.378z"/>
                    </svg>
                `);
            }

            await Promise.all(Object.values(assets.icons).map(i => i.promise));

            // 8. جلب فيديو الطبيعة من Pixabay API بالمفتاح المعتمد
            try {
                const pixabayApiUrl = 'https://pixabay.com/api/videos/?key=56876741-585140b10a2fb3d300627fff6&q=nature+mountains&per_page=3';
                const pRes = await fetch(pixabayApiUrl);
                if (pRes.ok) {
                    const pData = await pRes.json();
                    if (pData.hits && pData.hits.length > 0) {
                        const targetUrl = pData.hits[0].videos.tiny?.url || pData.hits[0].videos.small?.url;
                        logToConsole(`تم جلب رابط فيديو الطبيعة من Pixabay CDN: ${targetUrl}`, "info");
                        natureBrollSampler = await fetchAndPrepareBrollSampler(targetUrl);
                    }
                }
            } catch (err) {
                logToConsole("تعذر الاتصال بـ Pixabay API: " + err.message, "warn");
            }

            // فيديو احتياطي مباشر من Pixabay CDN في حال وجود قيود شبكة محلية
            if (!natureBrollSampler) {
                const directPixabayCdn = 'https://cdn.pixabay.com/video/2023/10/12/184734-874020967_tiny.mp4';
                natureBrollSampler = await fetchAndPrepareBrollSampler(directPixabayCdn);
            }
        }

        // =========================================================================
        // 2. PROCEDURAL SHAPES & HELPERS
        // =========================================================================
        function drawRounded(c, x, y, w, h, r) {
            c.beginPath();
            if (typeof r === 'number') {
                c.roundRect(x, y, w, h, r);
            } else {
                c.roundRect(x, y, w, h, [r.tl || 0, r.tr || 0, r.br || 0, r.bl || 0]);
            }
        }

        function drawDataIcon(c, x, y, color = '#1d76eb') {
            c.save();
            c.fillStyle = color;
            drawRounded(c, x, y + 8, 4.2, 10, 2); c.fill();
            drawRounded(c, x + 6.2, y + 4, 4.2, 14, 2); c.fill();
            drawRounded(c, x + 12.4, y, 4.2, 18, 2); c.fill();
            c.restore();
        }

        function drawPlus(c, x, y, color = '#475569', size = 18) {
            c.save();
            c.strokeStyle = color;
            c.lineWidth = 1.9;
            c.lineCap = 'round';
            c.beginPath();
            c.moveTo(x - size / 2, y); c.lineTo(x + size / 2, y);
            c.moveTo(x, y - size / 2); c.lineTo(x, y + size / 2);
            c.stroke();
            c.restore();
        }

        function drawChevron(c, x, y, color = '#9ca3af', size = 5) {
            c.save();
            c.strokeStyle = color;
            c.lineWidth = 1.8;
            c.lineCap = 'round';
            c.lineJoin = 'round';
            c.beginPath();
            c.moveTo(x - size, y - size * 0.35);
            c.lineTo(x, y + size * 0.45);
            c.lineTo(x + size, y - size * 0.35);
            c.stroke();
            c.restore();
        }

        function drawCursor(c, x, y, clicking = false) {
            c.save();
            c.translate(x, y);
            if (clicking) c.scale(0.9, 0.9);
            c.shadowColor = 'rgba(0, 0, 0, 0.22)';
            c.shadowBlur = 10;
            c.shadowOffsetY = 4;
            c.beginPath();
            c.moveTo(0, 0); c.lineTo(0, 20); c.lineTo(5.2, 15);
            c.lineTo(10.2, 24.5); c.lineTo(13.2, 23); c.lineTo(8.5, 13.8); c.lineTo(15.5, 13.8);
            c.closePath();
            c.fillStyle = '#0f172a';
            c.fill();
            c.strokeStyle = '#ffffff';
            c.lineWidth = 1.8;
            c.stroke();
            c.restore();
        }

        // =========================================================================
        // 3. MAIN RENDER TIMELINE: SCENE 1 -> SCENE 2
        // =========================================================================
        export async function drawSceneAtTime(time) {
            ctx.save();
            ctx.clearRect(0, 0, CONFIG.width, CONFIG.height);

            const scene1Duration = 5.2;
            const scene2Start = scene1Duration;

            // -----------------------------------------------------------------
            // SCENE 2: NATURE VIDEO FROM PIXABAY
            // -----------------------------------------------------------------
            if (time >= (scene1Duration - 0.6) && natureBrollSampler) {
                ctx.save();
                const natureTime = (time - (scene1Duration - 0.6)) % natureBrollSampler.duration;
                const brollCanvas = await natureBrollSampler.getFrameAt(natureTime);

                const slowZoom = 1.0 + (time - scene1Duration) * 0.016;
                ctx.translate(CONFIG.width / 2, CONFIG.height / 2);
                ctx.scale(slowZoom, slowZoom);
                ctx.drawImage(brollCanvas, -CONFIG.width / 2, -CONFIG.height / 2, CONFIG.width, CONFIG.height);

                // Organic cinematic vignette
                const vig = ctx.createRadialGradient(0, 0, 200, 0, 0, CONFIG.width * 0.7);
                vig.addColorStop(0, 'rgba(0, 0, 0, 0.08)');
                vig.addColorStop(0.7, 'rgba(0, 0, 0, 0.3)');
                vig.addColorStop(1, 'rgba(0, 0, 0, 0.55)');
                ctx.fillStyle = vig;
                ctx.fillRect(-CONFIG.width / 2, -CONFIG.height / 2, CONFIG.width, CONFIG.height);
                ctx.restore();
            }

            // -----------------------------------------------------------------
            // SCENE 1: SAAS AI PROMPT DOCK (EXACT REPLICA)
            // -----------------------------------------------------------------
            if (time < (scene1Duration + 0.6)) {
                ctx.save();

                // Canvas studio wash for Scene 1
                if (time < scene1Duration) {
                    const bgWash = ctx.createRadialGradient(
                        CONFIG.width / 2, CONFIG.height * 0.48, 80,
                        CONFIG.width / 2, CONFIG.height * 0.48, 900
                    );
                    bgWash.addColorStop(0, '#ffffff');
                    bgWash.addColorStop(0.7, '#f4f5f8');
                    bgWash.addColorStop(1, '#e9ecf0');
                    ctx.fillStyle = bgWash;
                    ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
                }

                // Seamless Outro Bridge: Forward Zoom-Through
                let s1Alpha = 1.0;
                let s1Scale = 1.0;
                if (time >= (scene1Duration - 0.8)) {
                    const exitT = clamp((time - (scene1Duration - 0.8)) / 0.8, 0, 1);
                    const exitEase = easeInOutCubic(exitT);
                    s1Scale = 1.0 + exitEase * 0.35;
                    s1Alpha = 1.0 - Math.pow(exitEase, 1.8);
                }
                ctx.globalAlpha = s1Alpha;

                // Motion timings
                const enterT = clamp(time / 0.8, 0, 1);
                const cardSpring = easeOutBack(enterT, 1.28);
                const shelfSpring = easeOutCubic(clamp((time - 0.35) / 0.65, 0, 1));

                // Typing logic
                const line1Text = "High traffic but flat sales for the Dash XV sneaker launch,";
                const line2Text = "what's the deal?";
                const fullText = line1Text + " " + line2Text;
                const typeStart = 0.9;
                const typeDur = 2.4;
                const typeProgress = clamp((time - typeStart) / typeDur, 0, 1);
                const totalChars = Math.floor(typeProgress * fullText.length);

                let dispLine1 = "", dispLine2 = "";
                if (totalChars <= line1Text.length) {
                    dispLine1 = line1Text.substring(0, totalChars);
                } else {
                    dispLine1 = line1Text;
                    dispLine2 = fullText.substring(line1Text.length + 1, totalChars);
                }

                const isTyping = time >= typeStart && time <= (typeStart + typeDur + 0.4);
                const caretBlink = isTyping && (Math.floor(time * 3.8) % 2 === 0);

                // Mouse interaction
                const curStart = 3.3;
                const curReach = 4.1;
                const clickT = 4.3;
                const mouseEase = easeInOutCubic(clamp((time - curStart) / (curReach - curStart), 0, 1));
                const isClicking = time >= clickT && time <= (clickT + 0.18);
                const isSubmitted = time >= clickT;

                // Layout coordinates
                const cardWidth = 1040;
                const topCardHeight = 188;
                const shelfVisibleHeight = 48;
                const totalCornerRadius = 32;

                const centerX = CONFIG.width / 2;
                const centerY = CONFIG.height / 2 - 10 + (1 - cardSpring) * 60;

                ctx.translate(centerX, centerY);
                ctx.scale(s1Scale, s1Scale);

                const x0 = -cardWidth / 2;
                const y0 = -topCardHeight / 2;

                // 1. Bottom Tray
                ctx.save();
                const trayY = y0 + topCardHeight - 20;
                const trayH = shelfVisibleHeight + 20;

                ctx.shadowColor = 'rgba(0, 0, 0, 0.04)';
                ctx.shadowBlur = 20;
                ctx.shadowOffsetY = 12;

                ctx.fillStyle = '#f1f3f5';
                drawRounded(ctx, x0, trayY, cardWidth, trayH, { tl: 0, tr: 0, br: totalCornerRadius, bl: totalCornerRadius });
                ctx.fill();

                ctx.shadowColor = 'transparent';
                ctx.strokeStyle = '#e5e7eb';
                ctx.lineWidth = 1.2;
                drawRounded(ctx, x0, trayY, cardWidth, trayH, { tl: 0, tr: 0, br: totalCornerRadius, bl: totalCornerRadius });
                ctx.stroke();

                // Tray content
                ctx.globalAlpha = shelfSpring * s1Alpha;
                const trayContentY = y0 + topCardHeight + 23;
                const leftPad = x0 + 36;
                ctx.drawImage(assets.icons.folder.img, leftPad, trayContentY - 10, 20, 20);

                ctx.font = '500 16px "Plus Jakarta Sans", sans-serif';
                ctx.fillStyle = '#717d8e';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText('Dash XV Launch', leftPad + 28, trayContentY);

                const stackStartX = leftPad + 210;
                const iconW = 20, iconH = 20, overlap = 11;

                ctx.drawImage(assets.icons.docs.img, stackStartX, trayContentY - 10, iconW, iconH);

                ctx.save();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.16)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = -2;
                ctx.drawImage(assets.icons.pdf.img, stackStartX + overlap, trayContentY - 10, iconW, iconH);
                ctx.restore();

                ctx.save();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.16)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = -2;
                ctx.drawImage(assets.icons.sheets.img, stackStartX + (overlap * 2), trayContentY - 10, iconW, iconH);
                ctx.restore();

                ctx.font = '500 16px "Plus Jakarta Sans", sans-serif';
                ctx.fillStyle = '#717d8e';
                ctx.fillText('Plugins', stackStartX + (overlap * 2) + iconW + 12, trayContentY);

                const rightPad = x0 + cardWidth - 36;
                ctx.drawImage(assets.icons.laptop.img, rightPad - 22, trayContentY - 10, 22, 22);
                ctx.restore();

                // 2. Top Card
                ctx.save();
                ctx.shadowColor = 'rgba(15, 23, 42, 0.05)';
                ctx.shadowBlur = 28;
                ctx.shadowOffsetY = 8;

                ctx.fillStyle = '#ffffff';
                drawRounded(ctx, x0, y0, cardWidth, topCardHeight, totalCornerRadius);
                ctx.fill();

                ctx.shadowColor = 'transparent';
                ctx.strokeStyle = '#e9ebef';
                ctx.lineWidth = 1.2;
                drawRounded(ctx, x0, y0, cardWidth, topCardHeight, totalCornerRadius);
                ctx.stroke();

                // Prompt Line 1 & Line 2
                const textLeft = x0 + 36;
                const line1Y = y0 + 44;
                const line2Y = line1Y + 36;

                drawDataIcon(ctx, textLeft, line1Y - 13, '#1d76eb');

                ctx.font = '700 24px "Plus Jakarta Sans", sans-serif';
                ctx.fillStyle = '#1d76eb';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText('Data', textLeft + 25, line1Y);

                const promptStartX = textLeft + 90;
                ctx.font = '500 24px "Plus Jakarta Sans", sans-serif';
                ctx.fillStyle = '#111827';
                ctx.fillText(dispLine1, promptStartX, line1Y);

                if (caretBlink && totalChars <= line1Text.length) {
                    const w1 = ctx.measureText(dispLine1).width;
                    ctx.fillStyle = '#1d76eb';
                    ctx.fillRect(promptStartX + w1 + 3, line1Y - 13, 2.2, 26);
                }

                if (dispLine2.length > 0) {
                    ctx.font = '500 24px "Plus Jakarta Sans", sans-serif';
                    ctx.fillStyle = '#111827';
                    ctx.fillText(dispLine2, textLeft, line2Y);

                    if (caretBlink) {
                        const w2 = ctx.measureText(dispLine2).width;
                        ctx.fillStyle = '#1d76eb';
                        ctx.fillRect(textLeft + w2 + 3, line2Y - 13, 2.2, 26);
                    }
                }

                // Controls row
                const controlsY = y0 + topCardHeight - 44;
                drawPlus(ctx, textLeft + 2, controlsY, '#475569', 18);

                const submitBtnRadius = 22;
                const submitBtnX = x0 + cardWidth - 36 - submitBtnRadius;
                const submitBtnY = controlsY;
                const micX = submitBtnX - 44;
                ctx.drawImage(assets.icons.mic.img, micX - 11, submitBtnY - 11, 22, 22);

                const modelX = micX - 28;
                drawChevron(ctx, modelX, submitBtnY + 1, '#9ca3af', 5);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.font = '500 16px "Plus Jakarta Sans", sans-serif';
                ctx.fillStyle = '#9ca3af';
                ctx.fillText('High', modelX - 14, submitBtnY);
                ctx.font = '600 16px "Plus Jakarta Sans", sans-serif';
                ctx.fillStyle = '#374151';
                ctx.fillText('6 Astra', modelX - 58, submitBtnY);

                // Submit Button
                ctx.save();
                let bScale = 1.0;
                if (isClicking) bScale = 0.9;
                else if (isSubmitted) {
                    const bounce = clamp((time - (clickT + 0.18)) / 0.35, 0, 1);
                    bScale = 1.0 + (1 - bounce) * 0.12;
                }
                ctx.translate(submitBtnX, submitBtnY);
                ctx.scale(bScale, bScale);

                ctx.fillStyle = '#0a0a0a';
                ctx.beginPath();
                ctx.arc(0, 0, submitBtnRadius, 0, Math.PI * 2);
                ctx.fill();

                if (isSubmitted) {
                    const rip = clamp((time - clickT) / 0.7, 0, 1);
                    ctx.save();
                    ctx.strokeStyle = `rgba(29, 118, 235, ${0.75 * (1 - rip)})`;
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(0, 0, submitBtnRadius + rip * 26, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2.4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(0, 7.5); ctx.lineTo(0, -6.5);
                ctx.moveTo(-5.5, -1); ctx.lineTo(0, -6.5); ctx.lineTo(5.5, -1);
                ctx.stroke();
                ctx.restore();

                // Mouse Pointer
                if (time >= curStart && time <= 4.9) {
                    const sX = cardWidth / 2 + 50, sY = topCardHeight / 2 + 70;
                    const tX = submitBtnX + 2, tY = submitBtnY + 2;
                    const curX = sX + (tX - sX) * mouseEase;
                    const curY = sY + (tY - sY) * mouseEase;
                    drawCursor(ctx, curX, curY, isClicking);
                }

                ctx.restore();
                ctx.restore();
            }

            // -----------------------------------------------------------------
            // SCENE 2: GPT LOGO DIRECTLY OVER NATURE (NO BOXES, NO LINES)
            // -----------------------------------------------------------------
            if (time >= scene2Start) {
                ctx.save();
                const s2Time = time - scene2Start;

                const gptEnterT = clamp(s2Time / 1.0, 0, 1);
                const gptSpring = easeOutBack(gptEnterT, 1.25);
                const gptAlpha = clamp(s2Time / 0.7, 0, 1);

                // Breathing motion
                const breathY = Math.sin(s2Time * 1.5) * 5;
                const pulseScale = 1.0 + Math.sin(s2Time * 2.2) * 0.02;

                const logoSize = 175;
                const logoCenterX = CONFIG.width / 2;
                const logoCenterY = CONFIG.height / 2 - 25 + breathY;

                ctx.translate(logoCenterX, logoCenterY);
                ctx.scale(gptSpring * pulseScale, gptSpring * pulseScale);
                ctx.globalAlpha = gptAlpha;

                // Soft shadow directly on nature background (No borders or cards!)
                ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
                ctx.shadowBlur = 30;
                ctx.shadowOffsetY = 10;

                // Draw pure white ChatGPT Logo directly on background
                ctx.drawImage(
                    assets.icons.chatgpt.img,
                    -logoSize / 2,
                    -logoSize / 2,
                    logoSize,
                    logoSize
                );

                // Subtle organic energy pulse
                const pulse = 0.5 + Math.sin(s2Time * 2.5) * 0.3;
                const glow = ctx.createRadialGradient(0, 0, 10, 0, 0, logoSize * 0.9);
                glow.addColorStop(0, `rgba(255, 255, 255, ${0.22 * pulse})`);
                glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(0, 0, logoSize * 0.9, 0, Math.PI * 2);
                ctx.fill();

                // Typography floating freely
                if (s2Time >= 1.2) {
                    const textFade = clamp((s2Time - 1.2) / 0.8, 0, 1);
                    ctx.globalAlpha = textFade * gptAlpha;

                    ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
                    ctx.shadowBlur = 16;
                    ctx.shadowOffsetY = 5;

                    ctx.font = '800 28px "Plus Jakarta Sans", sans-serif';
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('NATURAL INTELLIGENCE', 0, logoSize / 2 + 55);

                    ctx.font = '500 16px "Plus Jakarta Sans", sans-serif';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                    ctx.fillText('Powered by ChatGPT', 0, logoSize / 2 + 92);
                }

                ctx.restore();
            }

            // Final Horizon Outro Dissolve (Last 0.8s)
            if (time >= (CONFIG.duration - 0.8)) {
                const finalOutro = clamp((time - (CONFIG.duration - 0.8)) / 0.8, 0, 1);
                ctx.fillStyle = `rgba(7, 9, 14, ${finalOutro * 0.4})`;
                ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
            }

            ctx.restore();
        }

        // =========================================================================
        // 4. FIXED TECHNICAL LAYER & RUNTIME
        // =========================================================================
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusText = document.getElementById('status-text');
        const spinner = document.getElementById('spinner');

        let audioAudioEl = null;
        let sharedAudioCtx = null;
        let state = { currentTime: 0, isRendering: false, animationFrameId: null };

        window.renderStatus = 'loading';

        function logToConsole(msg, type = 'info') {
            const output = document.getElementById('console-output');
            const line = document.createElement('div');
            line.className = `log-line log-${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function clamp01(val) { return Math.max(0, Math.min(1, val)); }

        async function fetchAndPrepareBrollSampler(videoUrl, options = {}) {
            logToConsole("بدء معالجة فيديو B-roll كـ Blob محلي...", "info");
            let finalSrc = videoUrl;
            let isLocalBlob = false;

            try {
                const res = await fetch(videoUrl);
                if (res.ok) {
                    const arrayBuf = await res.arrayBuffer();
                    const blob = new Blob([arrayBuf], { type: 'video/mp4' });
                    finalSrc = URL.createObjectURL(blob);
                    isLocalBlob = true;
                }
            } catch (err) {
                logToConsole("الاعتماد على الرابط المباشر: " + err.message, "warn");
            }

            const videoEl = document.createElement('video');
            if (!isLocalBlob) videoEl.crossOrigin = 'anonymous';
            videoEl.muted = true;
            videoEl.playsInline = true;
            videoEl.preload = 'auto';
            videoEl.src = finalSrc;

            await new Promise((resolve, reject) => {
                let isReady = false;
                const onReady = () => { if (!isReady) { isReady = true; resolve(); } };
                videoEl.onloadeddata = onReady;
                videoEl.oncanplay = onReady;
                videoEl.onerror = () => reject(new Error(`خطأ في تشغيل الفيديو: ${videoUrl}`));
                videoEl.load();
            });

            const targetW = options.width || CONFIG.width;
            const targetH = options.height || CONFIG.height;
            const sampleCanvas = document.createElement('canvas');
            sampleCanvas.width = targetW;
            sampleCanvas.height = targetH;
            const sampleCtx = sampleCanvas.getContext('2d');

            return {
                videoEl,
                duration: videoEl.duration || 10,
                async getFrameAt(time) {
                    const maxDur = videoEl.duration && !isNaN(videoEl.duration) ? videoEl.duration : 10;
                    const seekTime = Math.min(Math.max(time, 0), Math.max(maxDur - 0.01, 0));

                    if (state.isRendering) {
                        await new Promise((resolve) => {
                            videoEl.onseeked = resolve;
                            videoEl.currentTime = seekTime;
                        });
                    } else {
                        if (videoEl.paused) videoEl.play().catch(() => {});
                    }

                    const vw = videoEl.videoWidth || targetW;
                    const vh = videoEl.videoHeight || targetH;
                    const scale = Math.max(targetW / vw, targetH / vh);
                    const dw = vw * scale;
                    const dh = vh * scale;
                    const dx = (targetW - dw) / 2;
                    const dy = (targetH - dh) / 2;

                    sampleCtx.clearRect(0, 0, targetW, targetH);
                    sampleCtx.drawImage(videoEl, dx, dy, dw, dh);
                    return sampleCanvas;
                }
            };
        }

        function startPreviewLoop() {
            if (state.animationFrameId) cancelAnimationFrame(state.animationFrameId);
            if (audioAudioEl) {
                audioAudioEl.currentTime = 0;
                audioAudioEl.play().catch(e => logToConsole("تنبيه الصوت: " + e.message, 'warn'));
            }

            const startTime = performance.now();
            async function loop(now) {
                if (state.isRendering) return;
                const elapsed = (now - startTime) / 1000;
                const currTime = audioAudioEl ? audioAudioEl.currentTime : (elapsed % CONFIG.duration);
                state.currentTime = currTime;
                await drawSceneAtTime(currTime);

                if (currTime < CONFIG.duration) {
                    state.animationFrameId = requestAnimationFrame(loop);
                } else {
                    statusText.textContent = "جاهز للعرض والتصدير ✓";
                    spinner.style.display = 'none';
                }
            }
            state.animationFrameId = requestAnimationFrame(loop);
        }

        const OFOQ_FRAME_FORMAT = 'image/png';
        window.__ofoqTotalFrames = 0;
        window.__ofoqFps = 0;
        window.__ofoqOutputFilename = '';
        window.__ofoqAudioWavBase64 = null;

        async function __ofoqGetFrameBatch(startFrame, count) {
            state.isRendering = true;
            const frames = [];
            for (let i = 0; i < count; i++) {
                const frameIndex = startFrame + i;
                if (frameIndex >= window.__ofoqTotalFrames) break;
                const timestamp = frameIndex / window.__ofoqFps;
                await drawSceneAtTime(timestamp);
                const dataUrl = canvas.toDataURL(OFOQ_FRAME_FORMAT);
                frames.push(dataUrl.substring(dataUrl.indexOf(',') + 1));
            }
            return frames;
        }
        window.__ofoqGetFrameBatch = __ofoqGetFrameBatch;

        document.getElementById('btn-replay').addEventListener('click', () => {
            statusText.textContent = "جاري عرض المعاينة...";
            spinner.style.display = 'inline-block';
            startPreviewLoop();
        });

        document.getElementById('btn-toggle-console').addEventListener('click', () => {
            const modal = document.getElementById('console-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        });

        document.getElementById('btn-close-console').addEventListener('click', () => {
            document.getElementById('console-modal').style.display = 'none';
        });

        document.getElementById('btn-render-start').addEventListener('click', () => {
            logToConsole("التصدير الفعلي يتم عبر render-runner.js (Node + ffmpeg).", 'warn');
        });

        async function init() {
            try {
                await prepareIdentity();
                canvas.width = CONFIG.width;
                canvas.height = CONFIG.height;

                const viewport = document.getElementById('viewport');
                viewport.style.aspectRatio = `${CONFIG.width} / ${CONFIG.height}`;
                viewport.style.width = `min(94vw, calc(86vh * (${CONFIG.width} / ${CONFIG.height})))`;

                window.__ofoqFps = CONFIG.fps;
                window.__ofoqTotalFrames = Math.ceil(CONFIG.duration * CONFIG.fps);
                window.__ofoqOutputFilename = `${OUTPUT_FILENAME}.mp4`;

                statusText.textContent = "جاهز للعرض والتصدير ✓";
                spinner.style.display = 'none';
                window.renderStatus = 'ready';
                await drawSceneAtTime(0);
                startPreviewLoop();
            } catch (err) {
                logToConsole("خطأ أثناء التهيئة: " + err.message, 'error');
                statusText.textContent = "حدث خطأ أثناء التحميل";
                window.__renderError = err.message;
                window.renderStatus = 'error';
            }
        }
        window.addEventListener('load', init);
    </script>
